name: StaffPlugin
version: 1.0.0
main: dev.staffplugin.StaffPlugin
api-version: '1.21'
description: Custom staff command system

commands:
  staff:
    description: Manage staff members
    usage: /staff <player> | /staff add <player> <cmd> | /staff remove <player> <cmd>
    permission: staffplugin.op
  unstaff:
    description: Remove staff from a player
    usage: /unstaff <player>
    permission: staffplugin.op
  modmode:
    description: Toggle mod mode
    usage: /modmode
  to:
    description: Teleport to a player
    usage: /to <player>
  bring:
    description: Bring player(s) to you
    usage: /bring <player> [player2 ...]
  tp:
    description: Teleport to coordinates
    usage: /tp <x> <y> <z>
  kill:
    description: Kill player(s) or entities
    usage: /kill <player/entity> [...]
  kick:
    description: Kick a player
    usage: /kick <player> [message]
  ban:
    description: Ban a player
    usage: /ban <player> [message]
  title:
    description: Show a title to player(s)
    usage: /title <player> <title text>
  freeze:
    description: Freeze a player
    usage: /freeze <player>
  unfreeze:
    description: Unfreeze a player
    usage: /unfreeze <player>
  gamemode:
    description: Change your gamemode
    usage: /gamemode <survival|creative|spectator>

permissions:
  staffplugin.op:
    description: Full access to staff management commands
    default: op
