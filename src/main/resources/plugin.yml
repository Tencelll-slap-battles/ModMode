name: StaffPlugin
version: 2.0.0
main: dev.staffplugin.StaffPlugin
api-version: '1.21'
description: Custom staff command system

commands:
  staff:
    description: Manage staff members
    usage: /staff <player> | /staff add <player> <cmd> | /staff remove <player> <cmd>
    permission: staffplugin.op
  unstaff:
    description: Remove staff from a player
    usage: /unstaff <player>
    permission: staffplugin.op
  modmode:
    description: Toggle mod mode
    usage: /modmode
  to:
    description: Teleport to a player (@p @r @s or name)
    usage: /to <player>
  bring:
    description: Bring player(s) to you
    usage: /bring <player|selector> [...]
  tp:
    description: Teleport to coordinates
    usage: /tp <x> <y> <z>
  kill:
    description: Kill player(s) or entities
    usage: /kill <player|selector> [...]
  kick:
    description: Kick a player
    usage: /kick <player|selector> [message]
  ban:
    description: Ban a player
    usage: /ban <player> [message]
  title:
    description: Show a title to player(s)
    usage: /title <player|selector> <title text>
  freeze:
    description: Freeze a player
    usage: /freeze <player|selector>
  unfreeze:
    description: Unfreeze a player
    usage: /unfreeze <player|selector>
  gamemode:
    description: Change your gamemode
    usage: /gamemode <survival|creative|spectator>
  invsee:
    description: View and edit a player's inventory
    usage: /invsee <player>
  give:
    description: Give item(s) to player(s)
    usage: /give <player|selector> <item> [amount]
  sudo:
    description: Force a player to send a chat message
    usage: /sudo <player|selector> <message>

  glow:
    description: Toggle red glow and MODMODE name
    usage: /glow <on|off>
  glow:
    description: Toggle red glow and MODMODE nametag
    usage: /glow <on|off>
permissions:
  staffplugin.op:
    description: Full access to staff management commands
    default: op
